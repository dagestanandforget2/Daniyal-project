<script>/*LIB*/
var T=18;
setLight([-.2,-.5,.85],.45,.75);
var cam=$('cam');
var KEYS=['ken','pi','tw'],B={};
KEYS.forEach(function(k){B[k]=makeBook(cam,k)});
var INFO=[
 {lab:'Open to knowledge.',ar:'كتاب العلم',en:'The Book of Knowledge',by:'Shaykh Ibn Uthaymeen',ed:'English edition.',t:[4.1,6.95]},
 {lab:'Open to the pillars.',ar:'أركان الإسلام والإيمان',en:'The Pillars of Islam & Iman',by:'Sheikh Muhammad bin Jamil Zeno',ed:'English hardcover. Darussalam.',t:[7.1,9.95]},
 {lab:'Open to tawhid.',ar:'كتاب التوحيد',en:'Kitab at-Tawhid',by:'Shaykh Muhammad ibn Abd al-Wahhab',ed:'English edition.',t:[10.1,12.8]}];
INFO.forEach(function(o){var g=el('','',$('bk'));o.el=g;var y=104,h='';
  h+='<p class="m hd" style="left:36px;top:'+y+'px;font-size:34px;color:var(--light)"><span>'+o.lab+'</span></p>';y+=54;
  h+='<p class="m ar" style="left:38px;top:'+y+'px;font-size:28px;direction:ltr;text-align:left"><span dir="rtl">'+o.ar+'</span></p>';y+=48;
  h+='<p class="m ti" style="left:38px;top:'+y+'px"><span>'+o.en+'</span></p>';y+=36;
  h+='<p class="m sb" style="left:38px;top:'+y+'px;font-weight:600;color:var(--light)"><span>'+o.by+'</span></p>';y+=26;
  h+='<p class="m sb" style="left:38px;top:'+y+'px"><span>'+o.ed+'</span></p>';
  g.innerHTML=h});
var MASK=[];document.querySelectorAll('[data-a]').forEach(function(e){MASK.push({e:e,s:+e.dataset.a,out:+e.dataset.o})});
function eo(x){x=cl(x);return x===1?1:1-Math.pow(2,-10*x)}
function hit(t,a0,amp,dec){return t>a0?Math.sin((t-a0)*46)*Math.exp(-(t-a0)*dec)*amp:0}
window.__seek=function(t){
  // doors: knocks, swing open (weighted), later swing shut with a bounce
  var knock=hit(t,1.85,1.2,14)+hit(t,2.12,1.2,14);
  var op=ob((t-2.6)/1.1), cls=t<15.15?0:ic((t-15.15)/.5), A;
  A=100*op*(1-cls); if(t>15.65)A=Math.abs(Math.sin((t-15.65)*16))*7*Math.exp(-(t-15.65)*7);
  $('L').style.transform='rotateY('+(A+knock*.6)+'deg)';$('R').style.transform='rotateY('+(-A-knock*.6)+'deg)';
  var lightOn=sm((t-2.6)/.8)*(1-sm((t-15.3)/.4));
  $('flash').style.opacity=lightOn*(.55+.45*Math.exp(-Math.max(0,t-2.9)*2.2));
  
  // camera: push through the doorway, pull back for the finale
  var push=io((t-3.0)/1.2)*(1-io((t-12.85)/.95));
  var S=1+1.75*push;
  var shk=hit(t,3.25,4,8)+hit(t,15.65,6,7);
  var pun=(t>3.25?.035*Math.exp(-(t-3.25)*3):0)+(t>15.65?.04*Math.exp(-(t-15.65)*3):0);
  $('world').style.transform='translateY('+shk+'px) scale('+(S*(1+pun))+')';
  $('bl').style.transform='translateY('+shk+'px)';
  cam.style.transform='rotateX(-3deg)';
  // books
  var bsh=0;
  KEYS.forEach(function(kk,i){var b=B[kk],bt=INFO[i].t;
    var pin=ob((t-bt[0]+.25)/.85), q=io((t-bt[1]+.15)/.6);
    if(t<13.2&&pin>0&&q<1){
      var z=lerp(-1500,0,pin)+lerp(0,-1700,q), ry=lerp(-200,-14,Math.min(1,pin))+Math.sin(t*1.2+i)*4+q*190,
          y=lerp(200,175,Math.min(1,pin))+q*-30, x=lerp(0,30,Math.min(1,pin))-q*30, o=cl(pin*3)*(1-cl((q-.6)/.4));
      bsh=Math.max(bsh,cl(pin)*(1-q));
      pose(b,{x:x,y:y,z:z,ry:ry,rx:0,rz:0,s:.86,op:o,g:1.08});return}
    // finale: three books standing inside the doorway
    var hp=ob((t-13.55-i*.14)/.75), dn=io((t-14.95+i*.05)/.5);
    if(hp<=0||dn>=1){pose(b,{hide:true});return}
    var FX=[-98,0,98][i],FR=[16,0,-16][i];
    pose(b,{x:FX,y:248+Math.sin(t*1.5+i)*2,z:lerp(-900,0,hp)+lerp(0,-1000,dn),ry:lerp(-160,FR,Math.min(1,hp)),s:.43,op:cl(hp*3)*(1-dn),g:1.05});
  });
  $('bshadow').style.opacity=bsh*.9;
  // text
  MASK.forEach(function(m){var q=eo((t-m.s)/.75),x=io((t-m.out)/.4);m.e.style.transform='translateY('+((1-q)*135+x*135)+'%)'});
  INFO.forEach(function(o){var a0=o.t[0],b2=o.t[1],sp=o.el.querySelectorAll('span');o.el.style.display=(t>a0-.05&&t<b2+.5)?'block':'none';
    sp.forEach(function(e,j){var q=eo((t-a0-j*.09)/.7),x=io((t-b2-j*.04)/.4);e.style.transform='translateY('+((1-q)*135+x*135)+'%)'})});
  // end card on the closed doors
  var lq=ob((t-15.85)/.7);$('lg').style.opacity=cl((t-15.85)/.25);$('lg').style.transform='scale('+(t<15.85?.6:Math.max(.6,lq))+')';
  var bq=ob((t-16.3)/.6);$('btnw').style.opacity=cl((t-16.3)/.2);$('btnw').style.transform='translateY('+((1-oc((t-16.3)/.6))*30)+'px) scale('+(t<16.3?.8:Math.max(.8,bq))+')';
  var pu=t>17.0?((t-17.0)%1.0)/1.0:-1;$('btn').style.transform=pu>=0?'scale('+(1+.04*Math.sin(Math.min(1,pu/.35)*Math.PI))+')':'none';
  $('stage').style.opacity=sm(t/.2);
};
window.__seek(0);
</script></body></html>
