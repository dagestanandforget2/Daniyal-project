<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Folded with Care</title>
<style>

html,body{margin:0;height:100%;background:#000;overflow:hidden}

.paperx{background:repeating-linear-gradient(to right,#efe6d2 0 4.5px,#d3c6aa 4.5px 7.5px)}
.papery{background:repeating-linear-gradient(to bottom,#efe6d2 0 4.5px,#d3c6aa 4.5px 7.5px)}
.shd{position:absolute;width:220px;height:30px;border-radius:50%;background:radial-gradient(50% 50% at 50% 50%,rgba(20,10,10,.55),rgba(20,10,10,0) 100%)}
.m{position:absolute;overflow:hidden;margin:0;white-space:nowrap;padding-bottom:.1em}

.hd{font-family:var(--d);font-weight:400;line-height:1.04}
.ar{font-family:var(--ar);font-weight:400;line-height:1.35;color:var(--sand)}
.sb{font-family:var(--ui);font-size:18px;line-height:1.35}
#panel{position:absolute;left:270px;top:600px;width:10px;height:10px;background:var(--red);transform:translate(-50%,-50%) rotate(45deg) scale(0)}
#lg{position:absolute;left:195px;top:150px;width:150px;height:150px;mix-blend-mode:screen;opacity:0}

<script>/*LIB*/

var MASK=[];document.querySelectorAll('[data-a]').forEach(function(e){MASK.push({e:e,s:+e.dataset.a,out:+e.dataset.o})});
function eo(x){x=cl(x);return x===1?1:1-Math.pow(2,-10*x)}
var BY=-13, S=.86, GND=600-480;
// book keyframes: t,x,y,z,rx,ry,rz,s
var BK={
 ts:[[4.55,0,BY-760,0,0,-30,-10,S],[5.05,0,BY,0,0,-18,0,S],[7.4,0,BY,40,0,-26,0,S],[8.0,-520,BY-60,0,0,-60,-14,S]],
 een:[[7.85,0,BY-760,0,0,24,10,S],[8.35,0,BY,0,0,16,0,S],[10.55,0,BY,40,0,22,0,S],[11.15,520,BY-60,0,0,60,14,S]],
 fw:[[10.95,0,BY-760,0,0,-26,-8,S],[11.45,0,BY,0,0,-16,0,S],[13.3,0,BY,30,0,-20,0,S]]};
var LAND={ts:5.05,een:8.35,fw:11.45};

window.__seek=function(t){
  // the fold: top triangle flips down onto the bottom one, and back up at the end
  var f1=os((t-2.6)/.85), f2=io((t-14.95)/.5), ang=180*(f1-f2);

  var hit=function(a,amp,dec){return t>a?Math.sin((t-a)*48)*Math.exp(-(t-a)*dec)*amp:0};
  var shk=hit(3.22,6,8)+hit(5.05,3,10)+hit(8.35,3,10)+hit(11.45,3,10);
  var pun=(t>3.22?.05*Math.exp(-(t-3.22)*3):0)+.025*Math.sin(t*.4);

    v=keyed(K_,t);

      var sF=.62, yF=GND-150*sF;
      v=[lerp(st[0],f[0],q),lerp(k==='fw'?st[1]:yF,yF,q),lerp(st[2],k==='fw'?30:0,q),0,lerp(st[4],f[1],q),0,lerp(k==='fw'?S:sF,sF,q)];
      v[1]-=gone*900; }

    SH[k].style.opacity=cl(1-dist/500)*cl(1-Math.abs(x)/450);
  });
  MASK.forEach(function(m){var q=eo((t-m.s)/.75),x=io((t-m.out)/.4);m.e.style.transform='translateY('+((1-q)*110+x*110)+'%)'});
  INFO.forEach(function(o){var a=o.t[0],b2=o.t[1],sp=o.el.querySelectorAll('span');o.el.style.display=(t>a-.05&&t<b2+.5)?'block':'none';

  $('stage').style.opacity=sm(t/.2);
};
