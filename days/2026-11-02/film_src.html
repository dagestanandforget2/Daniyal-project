<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>One Leads to the Next</title>
<style>
/*FONTS*/
:root{--mint:#BFE3D0;--ink:#0F2E25;--brass:#C9A043;--coral:#E8553D;--sage:#5E7F70;--d:'Shrikhand',serif;--ui:'Outfit',sans-serif;--ar:'Tajawal',sans-serif}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:540px;height:960px;overflow:hidden;color:var(--ink);font-family:var(--ui);

#world{position:absolute;inset:0}
.st3d{position:absolute;inset:0;perspective:1500px;perspective-origin:270px 300px;overflow:hidden}
.cam{position:absolute;left:270px;top:480px;width:0;height:0;transform-style:preserve-3d}
.cam *{transform-style:preserve-3d;position:absolute}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;transform-style:flat !important;background-size:100% 100%;background-repeat:no-repeat}
.face *{transform-style:flat !important}
.paperx{background:repeating-linear-gradient(to right,#efe6d2 0 4.5px,#d3c6aa 4.5px 7.5px)}
.papery{background:repeating-linear-gradient(to bottom,#efe6d2 0 4.5px,#d3c6aa 4.5px 7.5px)}
.rod{left:-800px;top:-318px;width:1600px;height:14px;border-radius:7px;
  background:linear-gradient(to bottom,#7A5A1C 0%,#E9C873 28%,#FFF0BE 40%,#C9A043 62%,#6E4F16 100%);box-shadow:0 10px 18px -8px rgba(15,46,37,.45)}

.wsh{width:110px;height:160px;left:-55px;top:-80px;background:rgba(15,46,37,.22);filter:blur(9px);border-radius:6px}
.m{position:absolute;overflow:hidden;margin:0;white-space:nowrap;padding-bottom:.12em}
.m>span{display:block}
.hd{font-family:var(--d);font-weight:400;line-height:1.08;color:var(--ink)}
.ar{font-family:var(--ar);font-weight:700;line-height:1.3;color:var(--coral)}
.sb{font-family:var(--ui);font-size:18px;line-height:1.35}
#flash{position:absolute;inset:0;background:#F4FFF8;opacity:0}
#sign{position:absolute;left:0;top:0;width:540px;height:960px;transform-origin:270px 170px}
#sign .s{position:absolute;width:2px;top:170px;left:269px;height:120px;background:#0F2E25;transform-origin:50% 0}
#hook{position:absolute;left:258px;top:160px;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFF0BE,#C9A043 55%,#6E4F16)}
#board{position:absolute;left:70px;top:262px;width:400px;height:440px;background:#FFFFFF;border-radius:22px;
  box-shadow:0 0 0 6px #0F2E25,0 34px 50px -20px rgba(15,46,37,.55)}
#lg{position:absolute;left:125px;top:22px;width:150px;height:150px;opacity:0}
.btn{display:inline-block;background:var(--coral);color:#fff;font-family:var(--ui);font-weight:600;font-size:25px;border-radius:50px;padding:15px 38px;box-shadow:0 14px 26px -14px rgba(232,85,61,.9)}
#grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:multiply;pointer-events:none;background:url(assets/grain.png);background-size:128px 128px}
</style></head><body>
<div id="stage">
 <div id="world">
  <div class="st3d"><div class="cam" id="cam"><div class="rod"></div></div></div>
 </div>
 <div id="t1">
  <p class="m hd" style="left:36px;top:486px;font-size:56px"><span data-a="0.35" data-o="3.0">One good book</span></p>
  <p class="m hd" style="left:36px;top:552px;font-size:56px"><span data-a="0.55" data-o="3.05">leads to</span></p>
  <p class="m hd" style="left:36px;top:618px;font-size:56px"><span data-a="0.75" data-o="3.1">the next.</span></p>
 </div>
 <div id="cap"></div>
 <div id="t3">
  <p class="m hd" style="left:36px;top:540px;font-size:58px"><span data-a="13.45" data-o="14.75">Read one.</span></p>
  <p class="m hd" style="left:36px;top:608px;font-size:58px"><span data-a="13.65" data-o="14.8">Then the next.</span></p>
 </div>
 <div id="flash"></div>
 <div id="sign">
  <div class="s" id="s1"></div><div class="s" id="s2"></div><div id="hook"></div>
  <div id="board">
   <img id="lg" src="assets/logo_dark.png" alt="Dar Al Athari">
   <p class="m hd" style="left:0;width:400px;text-align:center;top:188px;font-size:40px"><span data-a="15.75" data-o="99">daralathari.com</span></p>
   <p class="m sb" style="left:0;width:400px;text-align:center;top:252px;color:var(--sage);font-size:17px"><span data-a="15.95" data-o="99">Islamic books and garments,</span></p>
   <p class="m sb" style="left:0;width:400px;text-align:center;top:276px;color:var(--sage);font-size:17px"><span data-a="16.05" data-o="99">shipped worldwide.</span></p>
   <div id="btnw" style="position:absolute;left:0;width:400px;top:334px;text-align:center;opacity:0"><span class="btn" id="btn">Browse the books</span></div>
  </div>
 </div>
 <div id="grain"></div>
</div>
<script>/*LIB*/
var T=18;
setLight([-.35,-.55,.75],.5,.7);
var cam=$('cam');
var KEYS=['tw','ft','bi','ken'],B=[],SH=[],ST=[];
var S=.52, PY=170-480, LL=176, PX=[-162,-54,54,162], OFF=26;
KEYS.forEach(function(k,i){SH[i]=el('wsh','',cam);B[i]=makeBook(cam,k);ST[i]=[el('str','',cam),el('str','',cam)]});
// pins on the rod
PX.forEach(function(x){[-OFF,OFF].forEach(function(o){el('','left:'+(x+o-4)+'px;top:'+(PY-4)+'px;width:8px;height:8px;border-radius:50%;background:#0F2E25',cam)})});
var INFO=[
 {i:3,ar:'كتاب العلم',l:['The Book of','Knowledge'],by:'Shaykh Muhammad ibn Salih al-Uthaymeen',ed:'English edition.',t:[3.35,5.15]},
 {i:0,ar:'كتاب التوحيد',l:['Kitab','at-Tawhid'],by:'Shaykh Muhammad ibn Abd al-Wahhab',ed:'English edition.',t:[5.3,7.3]},
 {i:2,ar:'',l:['The Great Blessing'],sub:['in Collecting the Beliefs of','the Imams of the Sunnah'],by:'Compiled by Shaykh, Dr. Khalid Al-Dhafiri',ed:'English paperback. Hikmah Publications.',t:[8.75,10.35]},
 {i:1,ar:'التعليقات البهية',l:['Five Foundational','Treatises of Creed'],by:'Explained by Shaykh Ahmad bin Yahya al-Najmi',ed:'English paperback. Hikmah Publications.',t:[10.5,12.25]}];
INFO.forEach(function(o){var g=el('','',$('cap'));o.el=g;var y=486,h='';
  if(o.ar){h+='<p class="m ar" style="left:36px;top:'+y+'px;font-size:30px;direction:ltr"><span dir="rtl">'+o.ar+'</span></p>';y+=46}
  o.l.forEach(function(s){h+='<p class="m hd" style="left:36px;top:'+y+'px;font-size:42px"><span>'+s+'</span></p>';y+=48});
  y+=10;
  (o.sub||[]).forEach(function(s){h+='<p class="m sb" style="left:38px;top:'+y+'px;font-size:20px;font-weight:600"><span>'+s+'</span></p>';y+=27});
  if(o.sub)y+=8;
  h+='<p class="m sb" style="left:38px;top:'+y+'px;font-weight:600"><span>'+o.by+'</span></p>';y+=26;
  h+='<p class="m sb" style="left:38px;top:'+y+'px;color:var(--sage)"><span>'+o.ed+'</span></p>';
  g.innerHTML=h});
var MASK=[];document.querySelectorAll('[data-a]').forEach(function(e){MASK.push({e:e,s:+e.dataset.a,out:+e.dataset.o})});
function eo(x){x=cl(x);return x===1?1:1-Math.pow(2,-10*x)}

// ---- cradle choreography ----
var Q=.32, EV=[], STRIKES=[];
function pull(ids,p0,rel,A,dir){EV.push({k:'p',ids:ids,a:p0,b:rel,A:A,d:dir});EV.push({k:'r',ids:ids,a:rel,b:rel+Q,A:A,d:dir})}
function arc(ids,t0,A,dir){EV.push({k:'a',ids:ids,a:t0,b:t0+2*Q,A:A,d:dir})}
// phase 1: single book
pull([0],2.45,3.0,40,-1);
for(var k=0;k<6;k++){var s=3.0+Q+k*2*Q;STRIKES.push([s,.9*Math.pow(.92,k)]);arc(k%2?[0]:[3],s,40*Math.pow(.93,k),k%2?-1:1)}
var s6=3.0+Q+6*2*Q;STRIKES.push([s6,.5]);arc([3],s6,9,1);
// phase 2: two books
pull([0,1],7.95,8.4,36,-1);
for(k=0;k<5;k++){s=8.4+Q+k*2*Q;STRIKES.push([s,1*Math.pow(.92,k)]);arc(k%2?[0,1]:[2,3],s,36*Math.pow(.93,k),k%2?-1:1)}
s=8.4+Q+5*2*Q;STRIKES.push([s,.55]);arc([0,1],s,11,-1);
// hero: ken pulled high, released, tw loops the rod
var HR=13.0, HS=HR+Q;
pull([3],12.45,HR,85,1);
STRIKES.push([HS,1.6]);
function theta(i,t){var v=0;for(var j=0;j<EV.length;j++){var e=EV[j];if(e.ids.indexOf(i)<0||t<e.a||t>e.b)continue;
  if(e.k==='p')v+=e.d*e.A*io((t-e.a)/(e.b-e.a));
  else if(e.k==='r')v+=e.d*e.A*Math.cos(Math.PI/2*(t-e.a)/Q);
  else v+=e.d*e.A*Math.sin(Math.PI*(t-e.a)/(2*Q));}
  return v}
// tiny knock-on jiggle in the middle books at each strike
function jig(i,t){var v=0;STRIKES.forEach(function(s){var d=t-s[0];if(d>0&&d<.6)v+=Math.sin(d*55)*Math.exp(-d*9)*s[1]*(i==1||i==2?1.6:.8)});return v}
function setStr(e,x0,y0,x1,y1,z1,ax){var dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy,z1);
  var a=Math.atan2(dx,dy)*180/Math.PI;
  e.style.height=len+'px';e.style.transform='translate3d('+x0+'px,'+y0+'px,0) rotateX('+(ax||0)+'deg) rotateZ('+(-a)+'deg)'}

window.__seek=function(t){
  var hit=function(a,amp,dec){return t>a?Math.sin((t-a)*50)*Math.exp(-(t-a)*dec)*amp:0};
  var shk=hit(HS,7,7);STRIKES.forEach(function(s){if(s[0]!==HS)shk+=hit(s[0],1.4*s[1],12)});
  var pun=(t>HS?.06*Math.exp(-(t-HS)*2.6):0);
  var wz=io((t-12.35)/.65)*(1-io((t-14.25)/.6));
  $('world').style.transform='translateY('+shk+'px) scale('+(1+pun)+')';$('world').style.transformOrigin='270px 300px';
  var tilt=lerp(-3,-12,io((t-HS)/.5))*(1-io((t-14.3)/.6))+(-3)*io((t-14.3)/.6);
  cam.style.transform='translate3d(0,'+(193*wz)+'px,'+(-580*wz)+'px) rotateX('+tilt+'deg) rotateY('+(Math.sin(t*.45)*4)+'deg)';
  $('flash').style.opacity=t>HS?.55*Math.exp(-(t-HS)*7):0;
  var lift=io((t-14.55)/.55)*620;
  KEYS.forEach(function(k,i){var b=B[i],H=b.H*S;
    // drop-in on lengthening strings
    var d0=.25+i*.16, dq=t<d0?0:ob((t-d0)/.6), L=lerp(30,LL,dq);
    var th=(theta(i,t)+jig(i,t))*Math.PI/180, x=PX[i]+L*Math.sin(th), y=PY+L*Math.cos(th), z=0, ax=0;
    if(i===0&&t>HS){var x_=cl((t-HS)/1.05),lp=x_+.12*Math.sin(2*Math.PI*x_),a=360*lp;ax=a;var r=a*Math.PI/180;y=PY+L*Math.cos(r);z=L*Math.sin(r);x=PX[0]}
    y-=lift;
    var show=t>=d0;
    pose(b,show?{x:x,y:y,z:z,rx:ax,s:S,g:1.05}:{hide:true});
    var top=-H/2;
    [-OFF,OFF].forEach(function(o,j){var e=ST[i][j];e.style.display=show?'block':'none';if(!show)return;
      if(ax){var len=L-H/2;e.style.height=len+'px';e.style.transform='translate3d('+(PX[0]+o)+'px,'+(PY-lift)+'px,0) rotateX('+ax+'deg)'}
      else setStr(e,PX[i]+o,PY-lift,x+o,y+top,0)});
    SH[i].style.display=show?'block':'none';
    SH[i].style.transform='translate3d('+(x+16)+'px,'+(y+22)+'px,-90px) scale('+(1+z/600)+')';
    SH[i].style.opacity=cl(1-Math.abs(z)/150)*cl(dq);
  });
  MASK.forEach(function(m){var q=eo((t-m.s)/.75),x=io((t-m.out)/.4);m.e.style.transform='translateY('+((1-q)*112+x*112)+'%)'});
  INFO.forEach(function(o){var a=o.t[0],b2=o.t[1],sp=o.el.querySelectorAll('span');o.el.style.display=(t>a-.05&&t<b2+.5)?'block':'none';
    sp.forEach(function(e,j){var q=eo((t-a-j*.08)/.7),x=io((t-b2-j*.04)/.4);e.style.transform='translateY('+((1-q)*112+x*112)+'%)'})});
  // end card: a white sign drops on its strings and swings to rest
  var sd=14.85, sq=t<sd?0:ob((t-sd)/.65), sy=lerp(-760,0,sq);
  var sw=t>sd+.35?7*Math.sin((t-sd-.35)*5.2)*Math.exp(-(t-sd-.35)*1.9):0;
  $('sign').style.transform='translateY('+sy+'px) rotate('+sw+'deg)';
  $('sign').style.display=t<sd-.05?'none':'block';
  // strings from hook to board corners
  setS($('s1'),270,170,92,264);setS($('s2'),270,170,448,264);
  $('hook').style.transform='none';
  var lq=ob((t-15.45)/.6);$('lg').style.opacity=cl((t-15.45)/.25);$('lg').style.transform='scale('+(t<15.45?.6:Math.max(.6,lq))+')';
  var bq=ob((t-16.3)/.6);$('btnw').style.opacity=cl((t-16.3)/.2);$('btnw').style.transform='translateY('+((1-oc((t-16.3)/.6))*24)+'px) scale('+(t<16.3?.8:Math.max(.8,bq))+')';
  var pu=t>16.9?((t-16.9)%1.0)/1.0:-1;$('btn').style.transform=pu>=0?'scale('+(1+.04*Math.sin(Math.min(1,pu/.35)*Math.PI))+')':'none';
  $('stage').style.opacity=sm(t/.2);
};
function setS(e,x0,y0,x1,y1){var dx=x1-x0,dy=y1-y0;e.style.left=(x0-1)+'px';e.style.top=y0+'px';e.style.height=Math.hypot(dx,dy)+'px';e.style.transform='rotate('+(-Math.atan2(dx,dy)*180/Math.PI)+'deg)'}
window.__seek(0);
</script></body></html>
