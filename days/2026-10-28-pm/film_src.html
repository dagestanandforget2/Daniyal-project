<!--FONTS Yeseva One:yeseva-one:latin:400:normal; Albert Sans:albert-sans:latin:400,600:normal; El Messiri:el-messiri:arabic:600:normal -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Zellige</title>
<style>
/*FONTS*/
:root{--ox:#5B1A22;--bone:#EDE3CC;--och:#D6A53C;--ink:#1A1416;--cel:#3E5A4C;--d:'Yeseva One',serif;--u:'Albert Sans',sans-serif;--ar:'El Messiri',serif}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:540px;height:960px;overflow:hidden;background:var(--ink);color:var(--bone);font-family:var(--u)}
.st3d{position:absolute;inset:0;perspective:1200px;perspective-origin:270px 480px;overflow:hidden}
.cam{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.cam *{transform-style:preserve-3d;position:absolute}
#bcam{left:270px;top:480px}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;transform-style:flat !important;background-size:100% 100%;background-repeat:no-repeat}
.face *{transform-style:flat !important}
.paperx{background:repeating-linear-gradient(to right,#efe6d2 0 4.5px,#d3c6aa 4.5px 7.5px)}
.papery{background:repeating-linear-gradient(to bottom,#efe6d2 0 4.5px,#d3c6aa 4.5px 7.5px)}
.tf{left:0;top:0;width:90px;height:90px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:flat !important;background-repeat:no-repeat;box-shadow:inset 0 0 0 1.5px rgba(26,20,22,.55)}
.m{position:absolute;overflow:hidden;margin:0;white-space:nowrap;padding-bottom:.08em}
.m>span{display:block}
.hd{font-family:var(--d);line-height:1.02}
.ar{font-family:var(--ar);font-weight:600;direction:rtl}
#plq .m{left:40px}
.btn{display:inline-block;background:var(--och);color:var(--ink);font-weight:600;font-size:26px;border-radius:44px;padding:16px 36px;box-shadow:0 20px 44px -16px rgba(214,165,60,.45)}
#lg{position:absolute;left:200px;top:150px;width:140px;height:140px;mix-blend-mode:screen;opacity:0}
#grain{position:absolute;inset:0;opacity:.08;mix-blend-mode:overlay;pointer-events:none;background:url(assets/grain.png);background-size:128px 128px}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 60% at 50% 45%,transparent 55%,rgba(10,6,8,.55) 100%)}
</style></head><body>
<div id="stage">
 <div class="st3d"><div class="cam" id="tcam"></div></div>
 <div class="st3d"><div class="cam" id="bcam"></div></div>
 <div id="vig"></div>

 <div id="plq">
  <p class="m hd" style="top:116px;font-size:88px"><span data-a="0.35">Built on</span></p>
  <p class="m hd" style="top:204px;font-size:88px"><span data-a="0.5">Tawhid.</span></p>
  <p class="m" style="top:304px;font-size:23px;font-weight:600"><span data-a="0.95">Three works on creed, one tile at a time.</span></p>
 </div>
 <div id="cap"></div>

 <div id="end">
  <img id="lg" src="assets/logo.png" alt="Dar Al Athari">
  <p class="m hd" style="left:0;width:540px;text-align:center;top:322px;font-size:58px"><span data-a="15.75">daralathari.com</span></p>
  <p class="m" style="left:0;width:540px;text-align:center;top:404px;font-size:21px;color:rgba(237,227,204,.78)"><span data-a="16.0">Arabic and English books, shipped from New Jersey.</span></p>
  <div id="btnw" style="position:absolute;left:0;width:540px;top:478px;text-align:center;opacity:0"><span class="btn" id="btn">Browse the creed books</span></div>
 </div>
 <div id="grain"></div>
</div>
<script>/*LIB*/
var T=18;
setLight([-.3,-.35,.88],.47,.58);
var tcam=$('tcam'),bcam=$('bcam');
var COLS=6,ROWS=11,TS=90,Y0=-15,CX=270,CY=435,S=1.8,LIFT_S=1.12,LIFT_Y=318;
function svgStar(bg,fg,acc){return "url(\"data:image/svg+xml,"+encodeURIComponent(
 '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90"><rect width="90" height="90" fill="'+bg+'"/>'+
 '<g transform="translate(45 45)"><rect x="-27" y="-27" width="54" height="54" fill="'+fg+'"/><rect x="-27" y="-27" width="54" height="54" fill="'+fg+'" transform="rotate(45)"/>'+
 '<rect x="-15" y="-15" width="30" height="30" fill="'+bg+'"/><rect x="-15" y="-15" width="30" height="30" fill="'+bg+'" transform="rotate(45)"/><circle r="6" fill="'+acc+'"/></g>'+
 '<path d="M0 0L13 0L0 13ZM90 0L77 0L90 13ZM0 90L13 90L0 77ZM90 90L77 90L90 77Z" fill="'+acc+'"/></svg>')+"\")"}
var PA=svgStar('#5B1A22','#D6A53C','#3E5A4C'),PB=svgStar('#EDE3CC','#5B1A22','#D6A53C'),PE=svgStar('#1A1416','#2a1d20','#3a2427');
var BK=['tw','sth','ks'];
function coverCss(k,c,r){var b=SPEC[k],w=b.W*S,h=b.H*S,x0=CX-w/2,y0=CY-h/2,tx=c*TS,ty=Y0+r*TS;
  return 'background:#1A1416 url('+b.front+') no-repeat;background-size:'+w+'px '+h+'px;background-position:'+(x0-tx)+'px '+(y0-ty)+'px'}
var TL=[];
for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
  var g=el('','left:0;top:0;width:0;height:0',tcam),A=el('tf','',g),Bf=el('tf','',g);
  var pat=r<4?'background:#5B1A22':'background-image:'+((r+c)%2?PB:PA);
  var o={g:g,A:A,B:Bf,c:c,r:r,css:{A0:pat,B1:coverCss('tw',c,r),A2:coverCss('sth',c,r),B3:coverCss('ks',c,r),A4:'background-image:'+PE},cur:{}};
  TL.push(o)}
function setF(o,f,key){if(o.cur[f]!==key){o.cur[f]=key;o[f].style.cssText=o.css[key]}}
// flips: start time, direction of wave
var FL=[[2.55,0],[6.85,1],[10.75,0],[14.55,1]];
function tileDelay(o,dir){var d=dir===0?(o.c+(ROWS-1-o.r)):((COLS-1-o.c)+o.r);return d*0.055}
// books
var B={},PH=[[3.95,6.55],[8.15,10.45],[12.05,14.35]];
BK.forEach(function(k){var b=makeBook(bcam,k);B[k]=b});
// captions
var CAP={tw:{ar:'كتاب التوحيد',en:'Kitab at-Tawhid',sub:'',by:'Shaykh Muhammad ibn Abd al-Wahhab',lang:'English edition'},
 sth:{ar:'شرح ثلاثة الأصول',en:'Sharh Thalathat al-Usul',sub:'',by:'Shaykh Muhammad ibn Salih al-Uthaymeen',lang:'Arabic, hardcover'},
 ks:{ar:'شرح كشف الشبهات',en:'Sharh Kashf ash-Shubuhat',sub:'followed by Sharh al-Usul as-Sittah',by:'Shaykh Muhammad ibn Salih al-Uthaymeen',lang:'Arabic, hardcover'}};
BK.forEach(function(k,i){var cp=CAP[k],a=PH[i][0]+.55,g=el('','',$('cap'));g.id='cap'+k;var y=566;
  var h='<p class="m ar" style="right:72px;top:'+y+'px;font-size:30px;color:var(--och)"><span data-a="'+a+'">'+cp.ar+'</span></p>';
  h+='<p class="m hd" style="left:40px;top:'+(y+50)+'px;font-size:'+(k==='tw'?44:k==='ks'?30:36)+'px"><span data-a="'+(a+.12)+'">'+cp.en+'</span></p>';
  var yy=y+108;if(cp.sub){h+='<p class="m" style="left:40px;top:'+yy+'px;font-size:19px;font-style:italic"><span data-a="'+(a+.22)+'">'+cp.sub+'</span></p>';yy+=30}
  h+='<p class="m" style="left:40px;top:'+yy+'px;font-size:19px;font-weight:600;color:rgba(237,227,204,.85)"><span data-a="'+(a+.3)+'">'+cp.by+'</span></p>';
  h+='<p class="m" style="left:40px;top:'+(yy+30)+'px;font-size:18px;color:var(--och)"><span data-a="'+(a+.4)+'">'+cp.lang+'</span></p>';
  g.innerHTML=h;g._a=PH[i][0];g._b=PH[i][1]});
var FIT=false;function fit(){document.querySelectorAll('.fit').forEach(function(p){var sp=p.firstChild,fs=44;p.style.fontSize=fs+'px';while(sp.scrollWidth>425&&fs>22){fs--;p.style.fontSize=fs+'px'}})}
var MASK=[];document.querySelectorAll('[data-a]').forEach(function(e){MASK.push({e:e,s:+e.dataset.a})});
function eo(x){x=cl(x);return x===1?1:1-Math.pow(2,-10*x)}

window.__seek=function(t){
  
  // tiles
  var anyBook=false;
  TL.forEach(function(o){
    var tx=o.c*TS,ty=Y0+o.r*TS,rot=0,lift=0;
    // intro pop (radial)
    var dd=Math.hypot(o.c-2.5,o.r-6)*0.07,ip=ob((t-.05-dd)/.6),sc=t<.05+dd?0:Math.max(0,ip);
    FL.forEach(function(f,i){var q=(t-f[0]-tileDelay(o,f[1]))/.6;var p=io(q);rot+=180*p;lift+=Math.sin(Math.PI*cl(q))*70});
    var A=t<FL[1][0]?'A0':t<FL[3][0]?'A2':'A4',Bk=t<FL[2][0]?'B1':'B3';setF(o,'A',A);setF(o,'B',Bk);
    o.B.style.transform='rotateY(180deg)';
    // gap closes before lift
    o.g.style.transform='translate3d('+(tx+45)+'px,'+(ty+45)+'px,'+lift+'px) rotateY('+rot+'deg) scale('+sc+') translate(-45px,-45px)';
  });
  // book phases
  var vis=null;
  BK.forEach(function(k,i){var b=B[k],a=PH[i][0],e=PH[i][1];
    if(t<a||t>e+.05){pose(b,{hide:true});return}
    vis=k;var q=io((t-a)/1.0),back=io((t-(e-.7))/.7),u=q*(1-back),d=(t-a);
    var bounce=a+1.0<t?Math.sin((t-a-1.0)*9)*Math.exp(-(t-a-1.0)*5)*2.5*(1-back):0;
    pose(b,{x:0,y:lerp(CY-480,LIFT_Y-480,u),z:lerp(-b.D*S/2,60,u)+Math.sin(Math.PI*u)*120,s:lerp(S,LIFT_S,u),
      ry:u*(b.dir*-24+Math.sin(d*1.1)*4)+bounce*b.dir,rx:u*6,rz:-u*1.5,g:1});
  });
  // tile layer hidden while a book is lifted
  var hideT=0;PH.forEach(function(p){hideT=Math.max(hideT,cl((t-p[0])/.08)*(1-cl((t-(p[1]-.02))/.06)))});
  tcam.parentNode.style.opacity=1-hideT;
  // captions
  BK.forEach(function(k,i){var g=$('cap'+k),a=PH[i][0],e=PH[i][1];g.style.display=(t>a&&t<e+.1)?'block':'none';
    var o=io((t-(e-.75))/.4);g.style.transform='translateY('+(o*-16)+'px)';g.style.opacity=1-o});
  MASK.forEach(function(m){var q=eo((t-m.s)/.75);m.e.style.transform='translateY('+((1-q)*110)+'%)'});
  var ex=io((t-2.15)/.5);$('plq').style.transform='translateY('+(-ex*120)+'px)';$('plq').style.opacity=1-sm((t-2.2)/.4);
  // end
  var lq=ob((t-15.35)/.7);$('lg').style.opacity=cl((t-15.35)/.25);$('lg').style.transform='scale('+(t<15.35?.6:Math.max(.6,lq))+')';
  var bq=ob((t-16.3)/.6);$('btnw').style.opacity=cl((t-16.3)/.2);$('btnw').style.transform='translateY('+((1-oc((t-16.3)/.6))*30)+'px) scale('+(t<16.3?.8:Math.max(.8,bq))+')';
  var pu=t>17.0?((t-17.0)%1.2)/1.2:-1;$('btn').style.transform=pu>=0?'scale('+(1+.04*Math.sin(Math.min(1,pu/.35)*Math.PI))+')':'none';
  $('end').style.display=t>15.2?'block':'none';
  $('stage').style.opacity=sm(t/.2);
};
window.__seek(0);
</script></body></html>
