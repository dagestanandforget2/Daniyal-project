<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Break the Seal</title>
<style>

</style></head><body>
<div id="stage">

<script>/*LIB*/
var T=18;
setLight([-.3,-.5,.82],.45,.75);
var bcam=$('bcam');
var KEYS=['fw','pi','kar'],B={};
KEYS.forEach(function(k){B[k]=makeBook(bcam,k)});
var INFO=[
 {h1:'Open it for',h2:'the benefits.',ar:'الفوائد',en:"Al-Fawa'id",by:'Imam Ibn Qayyim al-Jawziyyah',ed:"Arabic hardcover. Dar Ata'at al-'Ilm."},
 {h1:'Open it for',h2:'the pillars.',ar:'أركان الإسلام والإيمان',en:'The Pillars of Islam & Iman',by:'Sheikh Muhammad bin Jamil Zeno',ed:'English hardcover. Darussalam.'},
 {h1:'Open it for',h2:'knowledge.',ar:'كتاب العلم',en:"Kitab al-'Ilm",by:'Shaykh Ibn Uthaymeen',ed:'Arabic edition.'}];
INFO.forEach(function(o){var g=el('','',$('bk'));o.el=g;var y=104,h='';
  h+='<p class="m hd" style="left:34px;top:'+y+'px;font-size:54px"><span>'+o.h1+'</span></p>';y+=52;
  h+='<p class="m hd" style="left:34px;top:'+y+'px;font-size:54px"><span>'+o.h2+'</span></p>';y+=66;
  h+='<div class="rule" style="top:'+y+'px"></div>';y+=8;
  h+='<p class="m ar" style="left:36px;top:'+y+'px;font-size:22px;direction:ltr;text-align:left"><span dir="rtl">'+o.ar+'</span></p>';y+=36;
  h+='<p class="m ti" style="left:36px;top:'+y+'px"><span>'+o.en+'</span></p>';y+=30;
  h+='<p class="m sb" style="left:36px;top:'+y+'px;font-weight:700"><span>'+o.by+'</span></p>';y+=20;
  h+='<p class="m sb" style="left:36px;top:'+y+'px"><span>'+o.ed+'</span></p>';
  g.innerHTML=h});
// wax seal svg
function blob(R,n,j,seed){var a=[];_seed=seed;for(var i=0;i<n;i++){var an=i/n*Math.PI*2,r=R*(1+(rnd()-.5)*j);a.push([r*Math.cos(an),r*Math.sin(an)])}
  var d='M'+((a[0][0]+a[n-1][0])/2).toFixed(1)+','+((a[0][1]+a[n-1][1])/2).toFixed(1);
  for(var i=0;i<n;i++){var p=a[i],q=a[(i+1)%n];d+='Q'+p[0].toFixed(1)+','+p[1].toFixed(1)+' '+((p[0]+q[0])/2).toFixed(1)+','+((p[1]+q[1])/2).toFixed(1)}return d+'Z'}
function star(R){var a=[];for(var i=0;i<16;i++){var r=i%2?R*0.62:R,an=(i*22.5-90)*Math.PI/180;a.push((r*Math.cos(an)).toFixed(2)+','+(r*Math.sin(an)).toFixed(2))}return 'M'+a.join('L')+'Z'}
var SEAL='<path d="'+blob(46,14,.16,11)+'" fill="url(#wx)"/>'+
 '<circle r="31" fill="none" stroke="#173426" stroke-width="3" opacity=".7"/><circle r="31" fill="none" stroke="#6FA285" stroke-width="1.2" transform="translate(-1,-1)" opacity=".8"/>'+
 '<path d="'+star(22)+'" fill="#244A37" transform="translate(1.2,1.6)"/><path d="'+star(22)+'" fill="#3F7458"/><path d="'+star(10)+'" fill="#CFA14A" opacity=".85"/>'+
 '<ellipse cx="-16" cy="-22" rx="12" ry="6" fill="#fff" opacity=".18" transform="rotate(-30)"/>';
function sealSvg(clip){return '<svg viewBox="-48 -48 96 96">'+(clip?'<defs><clipPath id="c'+clip+'"><path d="'+(clip==='L'?'M-60,-60 L4,-60 L-3,-28 L6,-8 L-4,10 L5,30 L-2,60 L-60,60Z':'M4,-60 L60,-60 L60,60 L-2,60 L5,30 L-4,10 L6,-8 L-3,-28Z')+'"/></clipPath></defs><g clip-path="url(#c'+clip+')">'+SEAL+'</g>':SEAL)+'</svg>'}
$('seal').innerHTML=sealSvg();$('sealL').innerHTML=sealSvg('L');$('sealR').innerHTML=sealSvg('R');
$('disc').innerHTML='<svg viewBox="-48 -48 96 96" style="width:96px;height:96px;overflow:visible"><path d="'+blob(46,14,.16,11)+'" fill="#2F5A44"/></svg>';
var CH=[];_seed=5;for(var i=0;i<14;i++){var c=el('chip','',$('chips'));CH.push({e:c,a:rnd()*Math.PI*2,v:160+rnd()*260,r:rnd()*720-360,s:.6+rnd()*1.1})}
var MASK=[];document.querySelectorAll('[data-a]').forEach(function(e){MASK.push({e:e,s:+e.dataset.a,out:+e.dataset.o})});
function eo(x){x=cl(x);return x===1?1:1-Math.pow(2,-10*x)}
function hit(t,a0,amp,dec){return t>a0?Math.sin((t-a0)*46)*Math.exp(-(t-a0)*dec)*amp:0}
var ARR=[2.75,6.05,9.35],EXIT=[5.55,8.85,12.0],TXT_OUT=[5.25,8.55,11.75];
var HIT=13.65;
// flap: 1=closed,-1=open
function flapC(t){var o1=io((t-2.15)/.6),c1=ob((t-12.2)/.5),o2=t>HIT?ob((t-HIT)/.35):0;
  return lerp(lerp(1,-1,o1),1,c1)*(1-o2)+(-1)*o2*(t>HIT?1:0)*1+0*o2}
window.__seek=function(t){
  // envelope arrival
  var ar=ob((t-.15)/.8),de=io((t-15.45)/.7);
  var ey=lerp(-560,0,ar)+de*520, er=lerp(-9,0,oc((t-.15)/.9));
  $('env').style.transform='translateY('+ey+'px) rotate('+er+'deg)';$('env').style.transformOrigin='270px 600px';
  $('env').style.opacity=t<.15?0:1;
  // flap
  var fc=t>HIT?lerp(1,-1,ob((t-HIT)/.4)):flapC(t);
  $('flap').style.transform='scaleY('+fc.toFixed(4)+')';
  $('flapP').setAttribute('fill',fc>=0?'#E4D3AC':'#C2AB7F');
  $('flap').parentNode.insertBefore($('flap'),fc>=0?$('seal'):$('st3d'));
  // seal 1: pops off at 2.0
  var s=$('seal'),pp=t-1.95;
  if(t<1.95){s.style.display='block';s.style.transform='scale('+(t<.15?1:1)+')'}
  else if(pp<.9){var q=oc(pp/.9);s.style.display='block';s.style.transform='translate('+(q*230)+'px,'+(-260*q+520*q*q)+'px) rotate('+(q*260)+'deg) scale('+lerp(1,1.15,q)+')';s.style.opacity=1-sm((pp-.6)/.3)}
  else s.style.display='none';
  // seal 2: slams on at 12.75, cracks at HIT
  var sL=$('sealL'),sR=$('sealR'),sa=t-12.72;
  if(sa<0||t>HIT+1.2){sL.style.display=sR.style.display='none'}
  else{sL.style.display=sR.style.display='block';var lan=oc(sa/.18),k=t-HIT;
    var sc=lerp(2.6,1,lan)*(1+hit(t,12.9,.06,10)),op=cl(sa/.08);
    if(k<0){var tr='scale('+sc+')';sL.style.transform=sR.style.transform=tr;sL.style.opacity=sR.style.opacity=op}
    else{var q=oc(k/.9);sL.style.transform='translate('+(-150*q)+'px,'+(-90*q+260*q*q)+'px) rotate('+(-80*q)+'deg)';sR.style.transform='translate('+(150*q)+'px,'+(-110*q+280*q*q)+'px) rotate('+(90*q)+'deg)';sL.style.opacity=sR.style.opacity=1-sm((k-.7)/.4)}}
  // chips
  CH.forEach(function(c){var k=t-HIT;if(k<0||k>1.1){c.e.style.display='none';return}c.e.style.display='block';var q=oc(k/1.1);
    c.e.style.transform='translate('+(Math.cos(c.a)*c.v*q)+'px,'+(Math.sin(c.a)*c.v*q+380*k*k)+'px) rotate('+(c.r*q)+'deg) scale('+c.s+')';c.e.style.opacity=1-sm((k-.7)/.4)});
  // camera: push into the seal, snap back on the crack
  var push=io((t-12.95)/.7)*(1-oc((t-HIT)/.5));
  var shk=hit(t,HIT,9,6.5)+hit(t,12.9,2.5,10)+hit(t,.95,3,9);
  ARR.forEach(function(a){shk+=hit(t,a+.95,1.2,10)});
  var sc=1+push*1.35+(t>HIT?.05*Math.exp(-(t-HIT)*3.5):0);
  $('world').style.transform='translate('+(shk*.4)+'px,'+shk+'px) scale('+sc.toFixed(4)+')';
  $('flash').style.opacity=t>HIT?(.7*Math.exp(-(t-HIT)*7)).toFixed(3):0;
  // books
  var stz=1;
  KEYS.forEach(function(k,i){var b=B[k],u=t-ARR[i],q=io((t-EXIT[i])/.65);
    if(u>=0&&q<.98){var p=oc(u/1.1),p2=ob((u-.15)/1.0);
      pose(b,{x:lerp(0,62,p)+q*-460,y:lerp(270,-34,p2)+Math.sin(t*1.4)*4-q*360,z:lerp(-80,60,p)+q*200,ry:lerp(0,-16,p)+Math.sin(t*.8)*3,rx:lerp(8,4,p),rz:lerp(0,4,p)-q*25,s:.92,g:lerp(.7,1.05,p),op:1});}
    else{var h=t-HIT-.05,o=io((t-15.25)/.6);
      if(h>=0&&o<.98){var p=ob(h/.75);
        pose(b,{x:lerp(0,[-148,0,148][i],oc(h/.6)),y:lerp(270,[-30,-60,-30][i],p)+Math.sin(t*1.3+i)*4-o*760,z:[0,70,0][i],ry:lerp(0,[22,0,-22][i],oc(h/.6)),rx:4,rz:lerp(0,[-9,0,9][i],oc(h/.6)),s:.64,g:1.02,op:1});}
      else pose(b,{hide:true});}
  });
  // end: green wax disc floods the screen
  var es=io((t-15.5)/.85);$('disc').style.transform='rotate('+lerp(-40,0,es)+'deg) scale('+(es*13)+')';
  // text
  MASK.forEach(function(m){var q=eo((t-m.s)/.7),x=io((t-m.out)/.4);m.e.style.transform='translateY('+((1-q)*135+x*135)+'%)'});
  INFO.forEach(function(o,i){var a0=ARR[i]+.6,b2=TXT_OUT[i],sp2=o.el.querySelectorAll('span');o.el.style.display=(t>a0-.05&&t<b2+.5)?'block':'none';
    sp2.forEach(function(e,j){var q=eo((t-a0-j*.08)/.7),x=io((t-b2-j*.03)/.4);e.style.transform='translateY('+((1-q)*135+x*135)+'%)'});
    var r=o.el.querySelector('.rule');r.style.transform='scaleX('+(io((t-a0-.2)/.5)*(1-io((t-b2)/.35)))+')'});
  // end card
  var lq=ob((t-15.95)/.7);$('lg').style.opacity=cl((t-15.95)/.25);$('lg').style.transform='scale('+(t<15.95?.6:Math.max(.6,lq))+')';
  var bq=ob((t-16.55)/.6);$('btnw').style.opacity=cl((t-16.55)/.2);$('btnw').style.transform='translateY('+((1-oc((t-16.55)/.6))*30)+'px) scale('+(t<16.55?.8:Math.max(.8,bq))+')';
  var pz=t>17.1?((t-17.1)%.9)/.9:-1;$('btn').style.transform=pz>=0?'scale('+(1+Math.sin(Math.min(1,pz/.3)*Math.PI)*.04)+')':'none';
  $('stage').style.opacity=sm(t/.2);
};
window.__seek(0);
</script></body></html>
