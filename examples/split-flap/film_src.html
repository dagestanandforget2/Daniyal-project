<!--FONTS Oswald:oswald:latin:600:normal; Inter Tight:inter-tight:latin:600,700:normal -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Dar Al Athari: Split-flap</title>
<style>
/*FONTS*/
:root{--flap:#1f1e1c;--flap2:#252421;--ch:#f3ede1;--amb:#f2a83a;--mut:#8f8a80;--disp:'Oswald','Arial Narrow',sans-serif;--sans:'Inter Tight','Helvetica Neue',sans-serif}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:540px;height:960px;overflow:hidden;background:radial-gradient(80% 60% at 50% 45%,#2a2826,#151413 60%,#0b0b0a);font-family:var(--sans);color:var(--ch)}
#board{position:absolute;left:30px;top:96px;width:480px;height:700px;border-radius:14px;background:linear-gradient(#11100f,#0c0c0b);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 30px 80px rgba(0,0,0,.6)}
.cell{position:absolute;width:44px;height:62px;perspective:260px}
.h{position:absolute;left:0;width:100%;height:50%;overflow:hidden;background:var(--flap);backface-visibility:hidden}
.h.t{top:0;border-radius:5px 5px 0 0;background:linear-gradient(#262522,#1f1e1c)}
.h.b{top:50%;border-radius:0 0 5px 5px;background:linear-gradient(#1c1b19,#232220)}
.h span{position:absolute;left:0;width:100%;text-align:center;font-family:var(--disp);font-weight:600;font-size:46px;line-height:62px;height:62px;color:var(--ch)}
.h.b span{top:-31px}
.h.ft{transform-origin:50% 100%;z-index:2}
.h.fb{transform-origin:50% 0;z-index:2}
.hinge{position:absolute;left:0;width:100%;top:30px;height:2px;background:#0a0a09;z-index:3}
.amber span{color:var(--amb)}
.img{position:absolute;left:105px;width:330px;height:420px;perspective:900px}
.img .h{background-size:330px 420px;background-repeat:no-repeat}
.img .h.t{background-position:0 0;border-radius:8px 8px 0 0}
.img .h.b{background-position:0 -210px;border-radius:0 0 8px 8px}
.img .hinge{top:209px}
.lab{position:absolute;left:0;width:540px;text-align:center;font-weight:700;font-size:11px;letter-spacing:.3em;color:var(--mut);text-transform:uppercase}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amb);margin-right:8px;vertical-align:1px;box-shadow:0 0 10px var(--amb)}
.pill{display:inline-block;padding:14px 30px;border-radius:40px;background:var(--amb);color:#1a1206;font-weight:700;font-size:21px;letter-spacing:-.01em;box-shadow:0 12px 34px rgba(242,168,58,.3)}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 70% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
#grain{position:absolute;inset:0;opacity:.08;mix-blend-mode:overlay;pointer-events:none;background:url(assets/grain.png);background-size:128px 128px}
</style></head><body>
<div id="stage">
 <div id="board"></div>
 <p class="lab" id="lab" style="top:110px;margin:0"><span class="dot" id="ldot"></span>Dar Al Athari · Now showing</p>
 <div id="cells"></div>
 <div style="position:absolute;left:0;width:540px;top:738px;text-align:center;opacity:0" id="cta"><span class="pill" id="pill">Shop at daralathari.com</span></div>
 <div id="vig"></div><div id="grain"></div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
function cl(x){return x<0?0:x>1?1:x} function sm(x){x=cl(x);return x*x*(3-2*x)} function oc(x){x=cl(x);return 1-Math.pow(1-x,3)}
function ob(x){x=cl(x);var c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}
function hash(n){var x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
var T=18, N=9, CH='ABCDEFGHIJKLMNOPQRSTUVWXYZ&.?';
// phases: start, row1, row2, image, row3
var PH=[[0.15,'SEEK','KNOWLEDGE','k_tw_front','AQEEDAH'],
        [3.0,'FROM THE','SCHOLARS','k_en_front','KNOWLEDGE'],
        [5.8,'PURIFY','THE HEART','e_front','TAZKIYAH'],
        [8.6,'ARABIC','& ENGLISH','a_front','ORIGINALS'],
        [11.4,'THOBES','SHEMAGHS','k_ar_front','& KUFIS'],
        [14.0,'DAR AL','ATHARI','logo','']];
function pad(s){var l=Math.floor((N-s.length)/2);s=Array(l+1).join(' ')+s;while(s.length<N)s+=' ';return s.slice(0,N)}
var ROWS=[{y:140,amber:false},{y:212,amber:true},{y:736,amber:false}];
var cells=[];
function mkHalf(cls,par){var d=document.createElement('div');d.className='h '+cls;d.innerHTML='<span></span>';par.appendChild(d);return d}
ROWS.forEach(function(r,ri){for(var c=0;c<N;c++){var e=document.createElement('div');e.className='cell'+(r.amber?' amber':'');e.style.left=(45+c*50)+'px';e.style.top=r.y+'px';
  var o={el:e,row:ri,col:c,t:mkHalf('t',e),b:mkHalf('b',e),ft:mkHalf('t ft',e),fb:mkHalf('b fb',e)};
  var hg=document.createElement('div');hg.className='hinge';e.appendChild(hg);$('cells').appendChild(e);cells.push(o)}});
// the big image flap
var IM=document.createElement('div');IM.className='img';IM.style.top='300px';$('cells').appendChild(IM);
var im={t:mkHalf('t',IM),b:mkHalf('b',IM),ft:mkHalf('t ft',IM),fb:mkHalf('b fb',IM)};(function(){var hg=document.createElement('div');hg.className='hinge';IM.appendChild(hg)})();
function setImg(h,name){if(!name){h.style.backgroundImage='none';h.style.background='linear-gradient(#262522,#1f1e1c)';return}
  if(name==='logo'){h.style.background='#000 url(assets/logo.png) no-repeat';h.style.backgroundSize='250px 250px';h.style.backgroundPosition=h.classList.contains('b')?'40px -125px':'40px 85px';return}
  h.style.background='url(assets/'+name+'.jpg) no-repeat';h.style.backgroundSize='330px 420px';h.style.backgroundPosition=h.classList.contains('b')?'0 -210px':'0 0'}
// build each cell's flip schedule: list of [time, char]
var D=.065;
function sched(row,col){var out=[[-1,' ']];PH.forEach(function(p,pi){var txt=pad([p[1],p[2],p[4]][row]);var ch=txt[col];var prev=out[out.length-1][1];
  var st=p[0]+col*.03+row*.09+(pi===5&&row===2?0:0);if(ch===prev&&hash(row*31+col*7+pi)<.5)return;
  var n=2+Math.floor(hash(row*91+col*13+pi*7)*5);
  for(var k=0;k<n;k++)out.push([st+k*D,CH[Math.floor(hash(row*3+col*17+pi*29+k*5)*CH.length)]]);
  out.push([st+n*D,ch])});return out}
cells.forEach(function(o){o.s=sched(o.row,o.col)});
var IS=[[-1,'']];PH.forEach(function(p){IS.push([p[0]+.25,p[3]])});
var FLIPS=[];cells.forEach(function(o){o.s.forEach(function(s){if(s[0]>0)FLIPS.push(s[0])})});window.FLIPS=FLIPS;
function state(S,t){for(var i=S.length-1;i>=0;i--)if(t>=S[i][0])return i;return 0}
function drawCell(o,t){var i=state(o.s,t),cur=o.s[i][1],prev=i>0?o.s[i-1][1]:' ',f=i>0?(t-o.s[i][0])/D:1;
  function put(h,c){h.firstChild.textContent=c}
  if(f>=1){put(o.t,cur);put(o.b,cur);o.ft.style.display='none';o.fb.style.display='none';return}
  put(o.t,cur);put(o.b,prev);o.ft.style.display='block';o.fb.style.display='block';put(o.ft,prev);put(o.fb,cur);
  var a=f<.5?f*2:1,b=f<.5?0:(f-.5)*2;
  o.ft.style.transform='rotateX('+(-90*a)+'deg)';o.ft.style.visibility=a<1?'visible':'hidden';
  o.fb.style.transform='rotateX('+(90*(1-b))+'deg)';o.fb.style.visibility=b>0?'visible':'hidden';}
var ID=.34;
function drawImg(t){var i=state(IS,t),cur=IS[i][1],prev=i>0?IS[i-1][1]:'',f=i>0?(t-IS[i][0])/ID:1;
  setImg(im.t,cur);
  if(f>=1){setImg(im.b,cur);im.ft.style.display=im.fb.style.display='none';return}
  setImg(im.b,prev);im.ft.style.display=im.fb.style.display='block';setImg(im.ft,prev);setImg(im.fb,cur);
  var a=f<.5?f*2:1,b=f<.5?0:(f-.5)*2;a=a*a;b=1-(1-b)*(1-b);
  im.ft.style.transform='rotateX('+(-90*a)+'deg)';im.ft.style.visibility=a<1?'visible':'hidden';
  // a little overshoot bounce as the flap lands
  var bounce=b>=1?0:0;im.fb.style.transform='rotateX('+(90*(1-b))+'deg)';im.fb.style.visibility=b>0?'visible':'hidden';
  im.ft.style.filter='brightness('+(1-a*.5)+')';im.fb.style.filter='brightness('+(.5+b*.5)+')';}
var lastImg=null;
window.__seek=function(t){
  cells.forEach(function(o){drawCell(o,t)});drawImg(t);
  // rows lift out at the end for the call to action
  var e=sm((t-14.0)/.6);cells.forEach(function(o){if(o.row===2)o.el.style.opacity=1-e});
  var c=$('cta'),q=ob((t-14.6)/.55);c.style.opacity=cl((t-14.6)/.2);c.style.transform='scale('+(t<14.6?0:Math.max(.3,q))+')';
  var pu=t>15.4?((t-15.4)%1.6)/1.6:-1;$('pill').style.transform=pu>=0?'scale('+(1+.045*Math.sin(Math.min(1,pu/.3)*Math.PI))+')':'none';
  $('ldot').style.opacity=.4+.6*(Math.floor(t*2)%2);
  $('stage').style.transform='scale('+(1.0+t*.0025)+')';
  $('stage').style.opacity=sm(t/.2)*(1-sm((t-(T-.3))/.3));
};
window.__seek(0);
</script></body></html>
