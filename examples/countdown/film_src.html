<!--FONTS Syne:syne:latin:700,800:normal; Inter:inter:latin:500,700:normal -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Dar Al Athari: Countdown</title>
<style>
/*FONTS*/
:root{--plum:#2a1236;--plum2:#3d1a4d;--peach:#ffb48a;--cream:#fff3ea;--dim:rgba(255,243,234,.66);--d:'Syne','Helvetica Neue',sans-serif;--s:'Inter','Helvetica Neue',sans-serif}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:540px;height:960px;overflow:hidden;background:var(--plum);color:var(--cream);font-family:var(--s)}
#blobs{position:absolute;inset:0}
.sc{position:absolute;inset:0;display:none}
.d{font-family:var(--d);font-weight:800;letter-spacing:-.03em;line-height:.9;margin:0;position:absolute;white-space:nowrap}
.s{font-family:var(--s);font-weight:700;margin:0;position:absolute;white-space:nowrap}
.num{margin:0;font-family:var(--d);font-weight:800;font-size:360px;line-height:.8;color:transparent;-webkit-text-stroke:3px var(--peach);position:absolute;letter-spacing:-.06em}
.num.f{color:var(--peach);-webkit-text-stroke:0}
.persp{position:absolute;inset:0;perspective:900px}
.card{position:absolute;width:250px;height:370px;border-radius:14px;overflow:hidden;box-shadow:0 40px 70px rgba(10,0,20,.55),0 0 0 1px rgba(255,255,255,.08);transform-style:preserve-3d}
.card .c{position:absolute;inset:0;background-size:cover;background-position:center}
.card .bw{position:absolute;inset:0;background-size:cover;background-position:center;filter:grayscale(1) contrast(1.15) brightness(.95)}
.card .tone{position:absolute;inset:0;background:linear-gradient(160deg,#ffb48a,#7a2a6b 70%,#2a1236);mix-blend-mode:color}
.card .gl{position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.35) 50%,rgba(255,255,255,0) 65%)}
.seg{position:absolute;top:100px;height:4px;border-radius:3px;background:rgba(255,243,234,.18);overflow:hidden}
.seg i{position:absolute;left:0;top:0;bottom:0;background:var(--peach);display:block}
.chip{display:inline-block;font-family:var(--s);font-weight:700;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--plum);background:var(--peach);padding:5px 11px;border-radius:20px}
.pill{display:inline-block;padding:15px 34px;border-radius:40px;background:var(--peach);color:var(--plum);font-family:var(--s);font-weight:700;font-size:21px;box-shadow:0 14px 34px rgba(255,180,138,.25)}
#grain{position:absolute;inset:0;opacity:.1;mix-blend-mode:overlay;pointer-events:none;background:url(assets/grain.png);background-size:128px 128px}
</style></head><body>
<div id="stage">
 <canvas id="blobs" width="540" height="960"></canvas>
 <div id="segs"></div>

 <div class="sc" id="h">
  <p class="d" id="h1" style="left:36px;top:150px;font-size:150px;color:var(--peach)">3</p>
  <p class="d" id="h2" style="left:36px;top:285px;font-size:84px">books</p>
  <p class="s" id="h3" style="left:40px;top:376px;font-size:28px;color:var(--dim)">to start your library.</p>
  <div class="persp"><div class="card" id="m1" style="left:150px;top:440px;width:180px;height:266px"><div class="c" style="background-image:url(assets/e_front.jpg)"></div></div>
   <div class="card" id="m2" style="left:190px;top:440px;width:180px;height:266px"><div class="c" style="background-image:url(assets/k_en_front.jpg)"></div></div>
   <div class="card" id="m3" style="left:230px;top:440px;width:180px;height:266px"><div class="c" style="background-image:url(assets/k_tw_front.jpg)"></div></div></div>
 </div>

 <div class="sc" id="i3"></div>
 <div class="sc" id="i2"></div>
 <div class="sc" id="i1"></div>

 <div class="sc" id="b">
  <p class="s" style="left:40px;top:130px"><span class="chip">Bonus</span></p>
  <p class="d" id="b1" style="left:36px;top:176px;font-size:56px">Read them</p>
  <p class="d" id="b2" style="left:36px;top:236px;font-size:56px;color:var(--peach)">in Arabic.</p>
  <div class="persp"><div class="card" id="ba" style="left:50px;top:340px;width:210px;height:300px"><div class="c" style="background-image:url(assets/k_ar_front.jpg)"></div><div class="gl"></div></div>
   <div class="card" id="bb" style="left:280px;top:360px;width:210px;height:300px"><div class="c" style="background-image:url(assets/a_front.jpg)"></div><div class="gl"></div></div></div>
  <p class="s" id="b3" style="left:0;width:540px;text-align:center;top:690px;font-size:14px;color:var(--dim);letter-spacing:.06em">Kitab al-'Ilm · Ad-Da' wa ad-Dawa'</p>
 </div>

 <div class="sc" id="e">
  <div id="lg" style="position:absolute;left:180px;top:150px;width:180px;height:180px;border-radius:50%;background:#000;overflow:hidden;box-shadow:0 0 0 2px rgba(255,180,138,.6),0 20px 50px rgba(0,0,0,.4)"><img src="assets/logo.png" alt="Dar Al Athari" style="width:100%;height:100%"></div>
  <p class="d" id="e1" style="left:0;width:540px;text-align:center;top:370px;font-size:56px">Start your</p>
  <p class="d" id="e2" style="left:0;width:540px;text-align:center;top:428px;font-size:56px;color:var(--peach)">library.</p>
  <div style="position:absolute;left:0;width:540px;text-align:center;top:540px" id="pw"><span class="pill" id="pill">Shop daralathari.com</span></div>
  <p class="s" id="e3" style="left:0;width:540px;text-align:center;top:626px;font-size:11px;letter-spacing:.26em;color:var(--dim)">BOOKS · THOBES · SHEMAGHS · KUFIS</p>
 </div>
 <div id="grain"></div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
function cl(x){return x<0?0:x>1?1:x} function sm(x){x=cl(x);return x*x*(3-2*x)} function oc(x){x=cl(x);return 1-Math.pow(1-x,3)}
function io(x){x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2} function lerp(a,b,p){return a+(b-a)*p}
function eo(x){x=cl(x);return x===1?1:1-Math.pow(2,-10*x)} function ob(x){x=cl(x);var c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}
var T=19;
var ITEMS=[['i3','3','e_front','The Disease','and the Cure','For the heart','Imam Ibn al-Qayyim',2.2],
           ['i2','2','k_en_front','The Book','of Knowledge','Before you study anything','Shaykh Ibn Uthaymeen',5.6],
           ['i1','1','k_tw_front','Kitab','at-Tawhid','Where it all begins','Shaykh Muhammad ibn Abd al-Wahhab',9.0]];
ITEMS.forEach(function(it){var s=$(it[0]);s.innerHTML=
  '<p class="num" style="left:6px;top:150px">'+it[1]+'</p><p class="num f" style="left:6px;top:150px;opacity:0">'+it[1]+'</p>'+
  '<div class="persp"><div class="card" style="left:250px;top:190px"><div class="bw" style="background-image:url(assets/'+it[2]+'.jpg)"></div><div class="tone"></div><div class="c" style="background-image:url(assets/'+it[2]+'.jpg);opacity:0"></div><div class="gl"></div></div></div>'+
  '<p class="s" style="left:40px;top:614px"><span class="chip">'+it[5]+'</span></p>'+
  '<p class="d" style="left:38px;top:648px;font-size:40px">'+it[3]+'</p>'+
  '<p class="d" style="left:38px;top:690px;font-size:40px;color:var(--peach)">'+it[4]+'</p>'+
  '<p class="s" style="left:40px;top:738px;font-size:15px;font-weight:500;color:var(--dim)">'+it[6]+'</p>';
  it.el=s;it.nums=s.querySelectorAll('.num');it.card=s.querySelector('.card');it.col=s.querySelector('.card .c');it.gl=s.querySelector('.gl');it.txt=s.querySelectorAll('p.s,p.d')});
// progress segments 03 02 01
var SG=[];for(var k=0;k<3;k++){var d=document.createElement('div');d.className='seg';d.style.left=(40+k*156)+'px';d.style.width='148px';d.innerHTML='<i></i>';$('segs').appendChild(d);SG.push(d)}
var SC=[['h',0,2.2],['i3',2.2,5.6],['i2',5.6,9.0],['i1',9.0,12.6],['b',12.6,14.6],['e',14.6,99]];
var bg=$('blobs').getContext('2d');
function blobs(t){bg.fillStyle='#2a1236';bg.fillRect(0,0,540,960);
  [[120,260,320,'rgba(122,42,107,.55)',.3],[430,640,360,'rgba(255,140,110,.22)',.22],[260,880,300,'rgba(90,30,120,.5)',.27]].forEach(function(b,i){
    var x=b[0]+Math.sin(t*b[4]+i)*70,y=b[1]+Math.cos(t*b[4]*1.3+i)*60,g=bg.createRadialGradient(x,y,0,x,y,b[2]);g.addColorStop(0,b[3]);g.addColorStop(1,'rgba(0,0,0,0)');bg.fillStyle=g;bg.fillRect(0,0,540,960)})}
window.__seek=function(t){
  blobs(t);
  // push transition: each new scene slides in from the right, the old one slides out left
  SC.forEach(function(s,i){var e=$(s[0]),nx=SC[i+1];var vis=t>=s[1]&&(!nx||t<nx[1]+.45);e.style.display=vis?'block':'none';
    var pin=i===0?1:eo((t-s[1])/.55),pout=nx?io((t-nx[1])/.45):0;
    e.style.transform='translateX('+((1-pin)*540-pout*540)+'px)';e.style.filter=(1-pin)>.05||pout>.05?'blur('+(((1-pin)+pout)*6).toFixed(1)+'px)':'none'});
  // progress bar
  SG.forEach(function(g,k){var s0=ITEMS[k][7],q=cl((t-s0)/3.4);g.firstChild.style.width=(q*100)+'%';g.style.opacity=t>2.0&&t<12.8?1:0});
  // hook
  var a=ob((t-.15)/.45);$('h1').style.transform='scale('+(t<.15?0:Math.max(0,a))+') rotate('+((1-cl((t-.15)/.45))*-20)+'deg)';$('h1').style.transformOrigin='20% 80%';
  $('h2').style.opacity=cl((t-.35)/.2);$('h2').style.transform='translateX('+((1-eo((t-.35)/.6))*-300)+'px)';
  $('h3').style.opacity=sm((t-.65)/.4);
  ['m1','m2','m3'].forEach(function(id,i){var q=eo((t-.7-i*.12)/.7),e=$(id);e.style.opacity=cl((t-.7-i*.12)/.15);
    e.style.transform='translateY('+((1-q)*500)+'px) rotateZ('+lerp(0,(i-1)*14,q)+'deg) rotateY('+(-12+Math.sin(t*1.5+i)*4)+'deg)';e.style.transformOrigin='50% 120%'});
  // the three countdown items
  ITEMS.forEach(function(it){var s0=it[7],l=t-s0;
    var nq=ob((l-.25)/.5);it.nums[0].style.transform=it.nums[1].style.transform='perspective(800px) rotateX('+((1-cl((l-.25)/.5))*-90)+'deg) scale('+Math.max(0,nq)+')';
    it.nums[0].style.opacity=cl((l-.25)/.1);it.nums[1].style.opacity=sm((l-1.0)/.4)*.25;
    var cq=eo((l-.45)/.8);it.card.style.transform='translateX('+((1-cq)*300)+'px) rotateY('+(lerp(-50,-16,cq)+Math.sin(t*1.2)*3)+'deg) rotateX('+(5+Math.sin(t*.9)*2)+'deg) rotateZ('+lerp(10,2,cq)+'deg)';
    it.col.style.opacity=sm((l-1.25)/.5);
    it.gl.style.transform='translateX('+lerp(-260,260,io((l-1.2)/.9))+'px)';
    for(var k=0;k<it.txt.length;k++){var q=eo((l-1.0-k*.12)/.6);it.txt[k].style.opacity=cl((l-1.0-k*.12)/.25);it.txt[k].style.transform='translateY('+((1-q)*24)+'px)'}
  });
  // bonus
  $('b1').style.opacity=cl((t-12.85)/.2);$('b1').style.transform='translateX('+((1-eo((t-12.85)/.6))*-300)+'px)';
  $('b2').style.opacity=cl((t-13.0)/.2);$('b2').style.transform='translateX('+((1-eo((t-13.0)/.6))*-300)+'px)';
  [['ba',13.1,-8],['bb',13.25,8]].forEach(function(c){var q=eo((t-c[1])/.7),e=$(c[0]);e.style.opacity=cl((t-c[1])/.15);e.style.transform='translateY('+((1-q)*400)+'px) rotateZ('+lerp(0,c[2],q)+'deg) rotateY('+(Math.sin(t*1.3)*6)+'deg)';
    e.querySelector('.gl').style.transform='translateX('+lerp(-240,240,io((t-c[1]-.5)/.9))+'px)'});
  $('b3').style.opacity=sm((t-13.6)/.4);
  // end
  var lq=ob((t-14.85)/.6);$('lg').style.transform='scale('+(t<14.85?0:Math.max(0,lq))+')';
  [['e1',15.1],['e2',15.25]].forEach(function(x){var q=eo((t-x[1])/.6);$(x[0]).style.opacity=cl((t-x[1])/.2);$(x[0]).style.transform='translateY('+((1-q)*30)+'px)'});
  var pq=ob((t-15.6)/.5);$('pw').style.opacity=cl((t-15.6)/.2);$('pw').style.transform='scale('+(t<15.6?0:Math.max(.3,pq))+')';
  var pu=t>16.3?((t-16.3)%1.6)/1.6:-1;$('pill').style.transform=pu>=0?'scale('+(1+.045*Math.sin(Math.min(1,pu/.3)*Math.PI))+')':'none';
  $('e3').style.opacity=sm((t-16.0)/.5);
  $('stage').style.opacity=sm(t/.12)*(1-sm((t-(T-.3))/.3));
};
window.__seek(0);
</script></body></html>
